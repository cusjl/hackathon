openapi: 3.1.0
info:
  title: 山东大学黑客松 API
  version: 0.0.1
  description: |
    根据仓库中的 Spring MVC Controller、DTO/VO、校验注解、鉴权拦截器与业务状态码整理。
    除 SDU Pass 回调外，业务接口统一返回 `{code, data, msg}`；成功时 `code` 为 200。
    受保护接口使用访问令牌，服务端同时兼容 `Authorization: Bearer <token>` 与直接传入令牌，本文档按标准 Bearer 方式描述。
    `x-required-roles` 和 `x-required-window` 是对仓库 `@Require` 约束的补充说明。
servers:
  - url: http://localhost:8080
    description: 本地开发环境
tags:
  - {name: 认证, description: SDU Pass、令牌兑换与账号密码登录}
  - {name: 用户, description: 用户资料、密码与外部账号创建}
  - {name: 学生, description: 学生注册、标签与资料}
  - {name: 权限, description: 超管、赛管和评委权限}
  - {name: 赛事, description: 赛事管理与查询}
  - {name: 赛道, description: 赛道及其轮次}
  - {name: 轮次, description: 轮次详情与提交配置}
  - {name: 报名, description: 学生赛道报名}
  - {name: 队伍, description: 组队与成员管理}
  - {name: 人才招募, description: 队伍招募、入队申请、组队邀请与选手自荐}
  - {name: 作品, description: 作品提交、补交和版本记录}
  - {name: 评审, description: 评分维度、评委指派、打分与监管}
  - {name: 文件, description: S3 预签名上传与文件访问}
  - {name: 投票, description: 大众投票与排行榜}
  - {name: 通知, description: 站内通知}
paths:
  /auth/test:
    post:
      tags: [认证]
      operationId: getTempToken
      summary: 生成测试临时令牌
      description: 仅用于测试；根据学号生成 REGISTER 或 EXCHANGE 类型的 5 分钟临时令牌。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SduPassTestDTO'}}}
      responses:
        '200': {description: 生成成功, content: {application/json: {schema: {$ref: '#/components/schemas/StringResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /auth/sdu-pass/login:
    get:
      tags: [认证]
      operationId: startSduPassLogin
      summary: 发起 SDU Pass 统一认证登录
      description: 302 到 SDU Pass 登录页。成功后 SDU Pass 将 code 回调到服务端配置的 callbackUrl；构造跳转地址失败时，302 到前端根地址并携带 error 查询参数。
      responses:
        '302':
          description: 重定向至 SDU Pass 登录页，或前端错误页
          headers:
            Location: {description: "SDU Pass 登录地址，或 http://localhost:5180?error=错误信息", schema: {type: string, format: uri}}
  /auth/sdu-pass-jwt:
    get:
      tags: [认证]
      operationId: sduPassLogin
      summary: SDU Pass 登录回调
      description: 使用 SDU Pass 返回的 code 换取身份，随后携带短时令牌重定向到前端注册页或首页；缺少 code 或换取/校验失败时，302 到前端根地址并携带 error 查询参数。
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}, description: SDU Pass 授权码；缺失时重定向到前端错误页}
      responses:
        '302':
          description: 重定向至前端
          headers:
            Location: {description: "前端地址，查询参数为 token（成功）或 error（失败）", schema: {type: string, format: uri}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /auth/exchange:
    get:
      tags: [认证]
      operationId: exchangeToken
      summary: 兑换短时令牌
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, minLength: 1}, description: REGISTER 或 EXCHANGE 类型短时令牌}
      responses:
        '200': {description: 兑换成功, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /auth/login:
    post:
      tags: [认证]
      operationId: localLogin
      summary: 账号密码登录
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LoginDTO'}}}
      responses:
        '200': {description: 登录成功, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}

  /user:
    get:
      tags: [用户]
      operationId: getExUser
      summary: 外部用户自查信息
      security: [{bearerAuth: []}]
      x-required-roles: [EXTERN]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/ExUserInfoResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [用户]
      operationId: updateExUser
      summary: 修改外部用户信息
      security: [{bearerAuth: []}]
      x-required-roles: [EXTERN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateExUserDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /user/{userId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [用户]
      operationId: getUser
      summary: 查询用户详情
      security: [{bearerAuth: []}]
      x-required-roles: [SELF, SUPER]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/UserInfoResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /user/password:
    put:
      tags: [用户]
      operationId: updatePassword
      summary: 修改密码
      security: [{bearerAuth: []}]
      x-required-roles: [LOGGED_IN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePasswordDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /user/admin/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [用户]
      operationId: createExternalAdmin
      summary: 创建赛事管理员账号
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateExUserDTO'}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '#/components/schemas/UserIdResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /user/judge/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [用户]
      operationId: createExternalJudge
      summary: 创建评委账号
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateExUserDTO'}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '#/components/schemas/UserIdResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /user/list:
    post:
      tags: [用户]
      operationId: getUserPage
      summary: 分页查询用户
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QueryUserDTO'}}}
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/UserPageResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}

  /student:
    post:
      tags: [学生]
      operationId: createStudent
      summary: 学生注册
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateStudentDTO'}}}
      responses:
        '200': {description: 注册成功, content: {application/json: {schema: {$ref: '#/components/schemas/CreateStudentResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    get:
      tags: [学生]
      operationId: getStudent
      summary: 学生自查信息
      security: [{bearerAuth: []}]
      x-required-roles: [STUDENT]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/StudentInfoResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [学生]
      operationId: updateStudent
      summary: 更新学生信息
      security: [{bearerAuth: []}]
      x-required-roles: [STUDENT]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateStudentDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /student/tags:
    get:
      tags: [学生]
      operationId: getAvailableTags
      summary: 获取可用学生标签
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/StudentTagsResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}

  /authority/super:
    post:
      tags: [权限]
      operationId: createSuper
      summary: 授予超级管理员权限
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserIdDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/super-self:
    delete:
      tags: [权限]
      operationId: deleteSuperSelf
      summary: 删除自己的超级管理员权限
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/admin-self:
    get:
      tags: [权限]
      operationId: getCurrentAdminEvents
      summary: 查询自己担任赛事管理员的赛事
      description: 返回当前登录用户直接拥有 ADMIN 权限的赛事及其 eventId；没有赛事管理员权限时返回空数组。超级管理员是全局权限，不会在此接口中展开为全部赛事。
      security: [{bearerAuth: []}]
      x-required-roles: [LOGGED_IN]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorityEventListResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/admin/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [权限]
      operationId: createAdminAuthority
      summary: 授予赛事管理员权限
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserIdDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [权限]
      operationId: deleteAdminAuthority
      summary: 删除赛事管理员权限
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserIdDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/admin-self/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    delete:
      tags: [权限]
      operationId: deleteAdminSelf
      summary: 删除自己的赛事管理员权限
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/judge/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [权限]
      operationId: createJudgeAuthority
      summary: 授予赛事评委权限
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserIdDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [权限]
      operationId: deleteJudgeAuthority
      summary: 删除赛事评委权限
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserIdDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/judge-self/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    delete:
      tags: [权限]
      operationId: deleteJudgeSelf
      summary: 删除自己的赛事评委权限
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_JUDGE]
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/event/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    get:
      tags: [权限]
      operationId: getAuthorityListByEvent
      summary: 查询赛事相关人员
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorityUserListResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /authority/user/{userId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [权限]
      operationId: getAuthorityListByUser
      summary: 查询用户所有权限
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/AuthorityEventListResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}

  /event:
    post:
      tags: [赛事]
      operationId: createEvent
      summary: 创建赛事
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateEventDTO'}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '#/components/schemas/EventIdResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /event/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    get:
      tags: [赛事]
      operationId: getEvent
      summary: 获取赛事详情及赛道名录
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/EventInfoResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [赛事]
      operationId: updateEvent
      summary: 更新赛事
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateEventDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [赛事]
      operationId: deleteEvent
      summary: 删除赛事
      security: [{bearerAuth: []}]
      x-required-roles: [SUPER]
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /event/{eventId}/track:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      tags: [赛事, 赛道]
      operationId: createTrack
      summary: 在赛事下创建赛道
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateTrackDTO'}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '#/components/schemas/TrackIdResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /event/list:
    post:
      tags: [赛事]
      operationId: getEventPage
      summary: 分页查询赛事
      security: [{}, {bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/QueryEventDTO'}}}
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/EventPageResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}

  /track/{trackId}:
    parameters:
      - {$ref: '#/components/parameters/TrackId'}
    get:
      tags: [赛道]
      operationId: getTrack
      summary: 获取赛道详情
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/TrackInfoResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [赛道]
      operationId: updateTrack
      summary: 更新赛道
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTrackDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [赛道]
      operationId: deleteTrack
      summary: 删除赛道
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /track/{trackId}/active:
    parameters:
      - {$ref: '#/components/parameters/TrackId'}
    get:
      tags: [赛道]
      operationId: getActivePhase
      summary: 获取赛道当前进行中的轮次
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/PhaseActiveResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /track/{trackId}/phase:
    parameters:
      - {$ref: '#/components/parameters/TrackId'}
    post:
      tags: [赛道, 轮次]
      operationId: createPhase
      summary: 在赛道下创建轮次
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreatePhaseDTO'}}}
      responses:
        '200': {description: 创建成功, content: {application/json: {schema: {$ref: '#/components/schemas/PhaseIdResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}

  /phase/{phaseId}:
    parameters:
      - {$ref: '#/components/parameters/PhaseId'}
    get:
      tags: [轮次]
      operationId: getPhase
      summary: 获取轮次详情
      security: [{}, {bearerAuth: []}]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/PhaseInfoResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [轮次]
      operationId: updatePhase
      summary: 更新轮次信息
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePhaseDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
    delete:
      tags: [轮次]
      operationId: deletePhase
      summary: 删除轮次
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
  /phase/{phaseId}/config:
    parameters:
      - {$ref: '#/components/parameters/PhaseId'}
    put:
      tags: [轮次]
      operationId: updatePhaseConfig
      summary: 更新轮次作品提交配置
      security: [{bearerAuth: []}]
      x-required-roles: [EVENT_ADMIN]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePhaseConfigDTO'}}}
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}

  /registration/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int32, minimum: 1}, description: POST 时为赛道 ID；GET、PUT、DELETE 时为赛事 ID}
    post:
      tags: [报名]
      operationId: createRegistration
      summary: 报名赛道
      security: [{bearerAuth: []}]
      x-required-roles: [STUDENT]
      x-required-window: REGISTRATION
      responses:
        '200': {$ref: '#/components/responses/OkResponse'}
        default: {$ref: '#/components/responses/ErrorResponse'}
    get:
      tags: [报名]
      operationId: getRegistration
      summary: 获取本人赛事报名信息
      security: [{bearerAuth: []}]
      x-required-roles: [STUDENT]
      responses:
        '200': {description: 获取成功, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationResult'}}}}
        default: {$ref: '#/components/responses/ErrorResponse'}
    put:
      tags: [报名]
      operationId: updateRegistration
      summary: 更改报名赛道
      security: [{bearerAuth: []}]
      x-required-roles: [STUDENT]
      requestBody:
        required: true
