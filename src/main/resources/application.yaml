spring:
  application:
    name: hackathon
  datasource:
    url: jdbc:mysql://localhost:3306/hackathon?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=true&jdbcCompliantTruncation=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
jwt:
  local:
    secret-key: ${HACKATHON_SECRET_KEY}
    expiration: 3600000
    short-expiration: 300000
  sdu-pass:
    sdu-pass-secret: ${SDU_PASS_SECRET}
    salt: KOISHIKISHIKAWAIIKAWAIIKISSKISSLOVELY
    iteration-cound: 114514
    key-length: 256
storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    access-key-id: ${S3_ACCESS_KEY_ID}
    secret-access-key: ${S3_SECRET_ACCESS_KEY}
    bucket-name: ${S3_BUCKET_NAME}
    path-style: ${S3_PATH_STYLE:true}
    put-expire-minutes: ${S3_PUT_EXPIRE_MINUTES:30}
    pending-expire-hours: ${S3_PENDING_EXPIRE_HOURS:24}
    deleted-retain-hours: ${S3_DELETED_RETAIN_HOURS:168}
hackathon:
  frontend-url:
  register-path:
  redirect-path:
  team-capacity: 5
